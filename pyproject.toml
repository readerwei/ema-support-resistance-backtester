[project]
name = "ema-sr-backtester"
version = "0.1.0"
description = "Research whether EMAs act as probabilistic support and resistance"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "requests>=2.31",
  "plotly>=5.24",
]

[project.scripts]
ema-sr = "ema_sr.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: full null-calibration study; excluded from default runs"]
addopts = "-m 'not slow'"
